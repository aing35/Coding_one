<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포모도로 & 투두 대시보드</title>
</head>
<body>

    <main class="dashboard-container">

        <header class="dashboard-header">
            <h1>생산성 대시보드</h1>
            <p>포모도로 타이머와 할 일 관리로 집중력을 높여보세요.</p>
        </header>

        <hr>

        <section class="pomodoro-section">
            <h2>⏱️ 포모도로 타이머</h2>
            
            <div class="timer-display">
                <span class="minutes">25</span>:<span class="seconds">00</span>
            </div>
            
            <div class="timer-controls">
                <button type="button" class="btn-start">시작</button>
                <button type="button" class="btn-stop">정지</button>
                <button type="button" class="btn-reset">초기화</button>
            </div>
        </section>

        <hr>

        <section class="todo-section">
            <h2>📝 오늘의 할 일 목록</h2>
            
            <form class="todo-form" onsubmit="return false;">
                <input type="text" class="todo-input" placeholder="새로운 할 일을 입력하세요..." required>
                <button type="submit" class="btn-todo-add">등록</button>
            </form>
            
            <div class="todo-list-area">
                <ul class="todo-list">
                    <li class="todo-item">
                        <input type="checkbox" id="todo-1">
                        <label for="todo-1">HTML5 기본 구조 잡기</label>
                    </li>
                    <li class="todo-item">
                        <input type="checkbox" id="todo-2">
                        <label for="todo-2">CSS로 대시보드 디자인 레이아웃 만들기</label>
                    </li>
                </ul>
            </div>
        </section>

    </main>

</body>
</html>
